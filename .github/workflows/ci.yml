name: CI

# 유닛 테스트 게이트 — push(main/develop)와 모든 PR에서 자동 실행한다.
# pom.xml surefire가 @Tag("integration")을 제외하므로 유닛만 돌며 DB/Redis가 필요 없다.
on:
  push:
    branches: [main, develop]
  pull_request:

# 같은 브랜치/PR에 새 커밋이 오면 진행 중이던 이전 실행을 취소해 러너를 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven          # ~/.m2 의존성 캐시로 재실행 단축

      - name: Run unit tests
        run: ./mvnw -B --no-transfer-progress test

      - name: Upload test reports
        if: always()            # 성공/실패와 무관하게 리포트 보존(실패 원인 파악)
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
